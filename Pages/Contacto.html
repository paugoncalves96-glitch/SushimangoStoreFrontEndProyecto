  <!-- FORMULARIO DE CONTACTO -->
  <section id="ubicacion">
    <h2>Contacto</h2>
    <div class="contenedor-contacto">
      <div id="contacto">
        <form action="https://formspree.io/f/xovkbajl" method="POST">
          <fieldset>
            <div class="form-input-container">
              <label class="input-title" for="nombre">Nombre:</label>
              <input class="form-input" type="text" id="nombre" name="nombre">
            </div>
            <div class="form-input-container">
              <label class="input-title" for="email">Correo Electrónico:</label>
              <input class="form-input" type="email" id="email" name="email">
            </div>
          </fieldset>
          <fieldset>
            <div class="form-input-container">
              <label class="input-title" for="mensaje">Mensaje</label>
              <textarea class="form-input form-textarea" id="mensaje" name="mensaje" rows="4" cols="30"></textarea>
            </div>
            <div>
              <button class="boton" type="submit">Enviar</button>
            </div>
          </fieldset>
        </form>
      </div>
  <!-- MAPA--->
